<!DOCTYPE html>
<html lang="arتفضل يا هشام! لقد قمت بدمج الأكواد والبيانات الخاصة بك (التوكن والـ Chat ID) داخل كود HTML و JavaScript جاهز ومتكامل تماماً.

كل ما عليك فعله هو **نسخ هذا الكود بالكامل**، ولصقه داخل ملف التطبيق الرئيسي لديك (**`index.html`**):

```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محفظة الوسيط القضائي</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f6f9;
            text-align: center;
            padding: 50px;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: auto;
        }
        button {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover {
            background-color: #006699;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>محفظة الوسيط القضائي</h2>
        <p>النظام محمي ومربود بنظام الإشعارات الفورية.</p>
        
        <!-- زر تجريبي لاختبار إرسال الإشعار إلى هاتفك -->
        <button onclick="sendTestAlert()">اختبار الإشعار الفوري</button>
    </div>

    <script>
        // إعدادات البوت والـ Chat ID الخاص بك
        const BOT_TOKEN = "9156328724:AAE6U_D1LAGlw-J43dCcVSUugu3AD4o02_U";
        const CHAT_ID = "9004777469";

        // دالة إرسال الإشعارات إلى تليجرام
        function sendTelegramAlert(messageText) {
            const url = `[https://api.telegram.org/bot$](https://api.telegram.org/bot$){BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(messageText)}`;

            fetch(url)
                .then(response => {
                    if (response.ok) {
                        alert("تم إرسال الإشعار بنجاح إلى هاتفك على تليجرام! 📱");
                    } else {
                        alert("فشل في إرسال الإشعار، يجدر التحقق من الاتصال.");
                    }
                })
                .catch(error => console.error("خطأ في الاتصال:", error));
        }

        // دالة تجريبية للاختبار عند الضغط على الزر
        function sendTestAlert() {
            sendTelegramAlert("⚠️ تنبيه: تم فتح أو اختبار تطبيق محفظة الوسيط القضائي بنجاح يا هشام!");
        }

        // فحص تلقائي عند فتح التطبيق (مثال: كشف محاولة التشغيل أو الدخول)
        window.onload = function() {
            // يمكنك تفعيل هذا السطر إذا أردت أن يصلك إشعار تلقائي بمجرد فتح التطبيق
            // sendTelegramAlert("🚀 تم تشغيل تطبيق محفظة الوسيط القضائي الآن.");
        };
    </script>

</body>
</html>
