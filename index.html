<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محفظة الوسيط القضائي - LegalTech</title>
    <!-- مكتبة Tailwind CSS للتصميم الجميل -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- مكتبة Supabase للاتصال السحابي -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans text-gray-800">

    <!-- شاشة إدخال المفاتيح المؤقتة (إذا لم تكن مخزنة) -->
    <div id="config-modal" class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 space-y-4">
            <h2 class="text-xl font-bold text-blue-900 flex items-center gap-2">
                <i class="fas fa-database text-blue-600"></i> إعداد اتصال Supabase
            </h2>
            <p class="text-sm text-gray-600">الرجاء إدخال بيانات مشروعك لكي يبدأ التطبيق في حفظ واسترجاع القضايا سحابياً:</p>
            <div>
                <label class="block text-xs font-semibold mb-1">Project URL</label>
                <input type="text" id="supabase-url" value="https://mojagltjszwipxwolxpi.supabase.co" class="w-full border rounded-lg p-2.5 text-sm bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold mb-1">Publishable Key (Anon)</label>
                <input type="password" id="supabase-key" placeholder="أصصق المفتاح هنا..." class="w-full border rounded-lg p-2.5 text-sm bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <button onclick="saveConfig()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition">
                حفظ وبدء التطبيق
            </button>
        </div>
    </div>

    <!-- التطبيق الرئيسي -->
    <div id="app" class="min-h-screen flex flex-col hidden">
        <!-- الشريط العلوي -->
        <header class="bg-blue-900 text-white shadow-md py-4 px-6 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fas fa-balance-scale text-2xl text-amber-400"></i>
                <h1 class="text-xl font-bold">محفظة الوسيط القضائي</h1>
            </div>
            <span class="bg-blue-800 text-xs px-3 py-1 rounded-full text-amber-300 border border-amber-400/30">مؤسسة ناشئة - الجزائر</span>
        </header>

        <!-- المحتوى -->
        <main class="flex-1 max-w-5xl w-full mx-auto p-4 md:p-6 space-y-6">
            <!-- قسم إضافة قضية -->
            <section class="bg-white rounded-2xl shadow-sm border p-5">
                <h2 class="text-lg font-bold text-blue-900 mb-4 flex items-center gap-2">
                    <i class="fas fa-folder-plus text-blue-600"></i> تسجيل قضية جديدة
                </h2>
                <form id="case-form" onsubmit="addCase(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="case-num" placeholder="رقم القضية (مثال: 2026/123)" required class="border rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="text" id="case-parties" placeholder="أطراف النزاع (مثال: أ. أحمد ضد ب. محمد)" required class="border rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    <select id="case-status" class="border rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="جارية">جارية</option>
                        <option value="معلقة">معلقة</option>
                        <option value="مفصولة / تم الصلح">مفصولة / تم الصلح</option>
                    </select>
                    <input type="text" id="case-notes" placeholder="ملاحظات أو مبالغ المالية (اختياري)" class="border rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    <button type="submit" class="md:col-span-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition flex items-center justify-center gap-2">
                        <i class="fas fa-save"></i> حفظ القضية في السحابة
                    </button>
                </form>
            </section>

            <!-- جدول عرض القضايا -->
            <section class="bg-white rounded-2xl shadow-sm border p-5 overflow-hidden">
                <h2 class="text-lg font-bold text-blue-900 mb-4 flex items-center gap-2">
                    <i class="fas fa-list text-blue-600"></i> القضايا المسجلة سحابياً
                </h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-right border-collapse text-sm">
                        <thead>
                            <tr class="bg-gray-100 text-gray-700 border-b">
                                <th class="p-3">رقم القضية</th>
                                <th class="p-3">الأطراف</th>
                                <th class="p-3">الحالة</th>
                                <th class="p-3">ملاحظات</th>
                                <th class="p-3 text-center">إجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="cases-list">
                            <!-- يتم تعبئتها ديناميكياً من Supabase -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- كود الجافاسكريبت للربط مع Supabase -->
    <script>
        let supabaseClient = null;

        // التحقق من وجود مفاتيح مخزنة مسبقاً
        window.onload = function() {
            const savedUrl = localStorage.getItem('sb_url');
            const savedKey = localStorage.getItem('sb_key');
            if (savedUrl && savedKey) {
                initSupabase(savedUrl, savedKey);
            }
        };

        function saveConfig() {
            const url = document.getElementById('supabase-url').value.trim();
            const key = document.getElementById('supabase-key').value.trim();
            if(!url || !key) {
                alert('الرجاء إدخال الرابط والمفتاح بشكل صحيح!');
                return;
            }
            localStorage.setItem('sb_url', url);
            localStorage.setItem('sb_key', key);
            initSupabase(url, key);
        }

        function initSupabase(url, key) {
            try {
                supabaseClient = window.supabase.createClient(url, key);
                document.getElementById('config-modal').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
                loadCases();
            } catch (e) {
                alert('خطأ في الاتصال: تأكد من صحة المفاتيح.');
            }
        }

        // جلب القضايا من قاعدة البيانات السحابية
        async function loadCases() {
            const { data, error } = await supabaseClient.from('cases').select('*').order('id', { ascending: false });
            const tbody = document.getElementById('cases-list');
            tbody.innerHTML = '';

            if (error) {
                console.error(error);
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-red-500">خطأ في جلب البيانات: ${error.message}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-500">لا توجد قضايا مسجلة حتى الآن.</td></tr>`;
                return;
            }

            data.forEach(c => {
                tbody.innerHTML += `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-3 font-semibold text-blue-900">${c.num}</td>
                        <td class="p-3">${c.parties}</td>
                        <td class="p-3">
                            <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${c.status === 'جارية' ? 'bg-amber-100 text-amber-800' : 'bg-green-100 text-green-800'}">
                                ${c.status}
                            </span>
                        </td>
                        <td class="p-3 text-gray-600">${c.notes || '-'}</td>
                        <td class="p-3 text-center">
                            <button onclick="deleteCase(${c.id})" class="text-red-500 hover:text-red-700 transition px-2 py-1">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        // إضافة قضية جديدة إلى Supabase
        async function addCase(e) {
            e.preventDefault();
            const num = document.getElementById('case-num').value;
            const parties = document.getElementById('case-parties').value;
            const status = document.getElementById('case-status').value;
            const notes = document.getElementById('case-notes').value;

            const { error } = await supabaseClient.from('cases').insert([{ num, parties, status, notes }]);
            
            if (error) {
                alert('فشل الحفظ: ' + error.message);
            } else {
                document.getElementById('case-form').reset();
                loadCases();
            }
        }

        // حذف قضية من السحابة
        async function deleteCase(id) {
            if(confirm('هل أنت متأكد من حذف هذه القضية نهائياً؟')) {
                const { error } = await supabaseClient.from('cases').delete().eq('id', id);
                if(error) {
                    alert('خطأ في الحذف: ' + error.message);
                } else {
                    loadCases();
                }
            }
        }
    </script>
</body>
</html>
